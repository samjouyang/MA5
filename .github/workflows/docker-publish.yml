name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/samjouyang/ma5:latest

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test installed packages
        run: |
          docker run --rm ghcr.io/samjouyang/ma5:latest bash -c "which nmap && which aria2c && which traceroute && python -c \"import geopandas, babypandas; from importlib.metadata import version; print('geopandas', geopandas.__version__); print('babypandas', version('babypandas'))\""
